<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Роадмап: Нагрузочное тестирование</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1f;
    color: #e8e8ee;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    padding: 14px 20px 6px;
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 2px;
    font-weight: 600;
  }
  header p {
    margin: 0;
    font-size: 12px;
    color: #9a9aa5;
  }
  .markmap {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .markmap > svg {
    width: 100%;
    height: 100%;
  }
  .markmap {
    --markmap-text-color: #f5f5f7 !important;
  }
</style>
</head>
<body>
<header>
  <h1>Роадмап: Нагрузочное тестирование (НТ)</h1>
  <p>Клик по кружку — свернуть/развернуть ветку · колесо мыши — зум · перетаскивание — панорама</p>
</header>

<div class="markmap">
  <script type="text/template" id="mm-source"></script>
</div>

<script>
  // ручной режим: не рендерить, пока не подгрузили содержимое roadmap.md
  window.markmap = { autoLoader: { manual: true } };
</script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@latest"></script>
<script>
(async () => {
  const res = await fetch('roadmap.md');
  const md = await res.text();
  document.getElementById('mm-source').textContent = md;
  window.markmap.autoLoader.renderAll();
  
  // Add click handlers for markdown links after rendering
  window.addEventListener('load', function() {
    // Wait a bit for the markmap to render
    setTimeout(function() {
      const svgElements = document.querySelectorAll('.markmap .node text');
      svgElements.forEach(element => {
        // Check if the element has a link (we'll need to parse the markdown)
        // For now, we'll add click handlers to all nodes and handle navigation logic
        element.addEventListener('click', function(e) {
          // Prevent default behavior
          e.preventDefault();
          e.stopPropagation();
          
          // Get the text content of clicked node
          const text = this.textContent.trim();
          
          // Simple routing based on section names
          switch(text) {
            case 'Роадмап: Нагрузочное тестирование (НТ)':
              window.location.href = 'placeholder-link-1';
              break;
            case '1. Основы НТ':
              window.location.href = 'placeholder-link-1';
              break;
            case '2. Сети и API':
              window.location.href = 'placeholder-link-2';
              break;
            case '3. Jmeter':
              window.location.href = 'placeholder-link-3';
              break;
            case '4. GIT':
              window.location.href = 'placeholder-link-4';
              break;
            case '5. Java':
              window.location.href = 'placeholder-link-5';
              break;
            case '6. Среда, Инфраструктура':
              window.location.href = 'placeholder-link-6';
              break;
            case '7. Базы данных':
              window.location.href = 'placeholder-link-7';
              break;
            case '8. Мониторинг и логирование':
              window.location.href = 'placeholder-link-8';
              break;
            default:
              // If no match, do nothing or handle as needed
              return;
          }
        });
      });
    }, 1000);
  });
})();
</script>
</body>
</html>
